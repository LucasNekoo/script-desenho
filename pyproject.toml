[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autodraw-lineart"
dynamic = ["version"]
description = "Extração de line art por IA (Anime2Sketch, CPU) para o AutoDraw, em processo separado."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Instale o torch do índice CPU ANTES deste pacote (veja o README):
    # pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.6",
    "numpy>=1.24",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
download = ["gdown>=5.0"]
# Só para examples/linhas_para_tracos.py (o pós-processamento de referência do AutoDraw).
examples = ["opencv-python-headless>=4.8", "scikit-image>=0.22"]
dev = ["pytest>=8.0", "ruff>=0.6", "opencv-python-headless>=4.8", "scikit-image>=0.22"]

[project.scripts]
autodraw-lineart = "autodraw_lineart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "autodraw_lineart.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["weights: precisa dos pesos reais (pulado se não estiverem disponíveis)"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/autodraw_lineart/network.py"]  # cópia do upstream; mantida próxima do original

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]
