[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-autodraw"
dynamic = ["version"]
description = "Converte imagens em movimentos de mouse e reproduz o desenho numa área da tela."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pyautogui>=0.9.54",
    "pydirectinput>=1.0.4 ; sys_platform == 'win32'",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
autodraw = "autodraw.app:run"

[tool.setuptools]
packages = ["autodraw"]

[tool.setuptools.dynamic]
version = { attr = "autodraw.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "UP006",  # List/Dict/Tuple de typing: o projeto ainda suporta 3.9
    "UP007",  # Optional/Union idem
    "UP035",
    "UP045",
    "SIM105",  # try/except/pass é o idioma adotado no projeto
]
