name: CI

on:
  push:
    branches: [main, autodraw-lineart]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PyTorch só para CPU, do índice oficial. Os pesos não são baixados na CI:
      # o teste com o modelo real é pulado e os demais usam pesos aleatórios.
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -rs
