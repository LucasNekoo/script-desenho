name: CI

on:
  push:
    branches: [main, developer]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Os testes cobrem só o núcleo (sem GUI nem mouse real), então basta a
      # versão headless do OpenCV, que dispensa bibliotecas gráficas no runner.
      - run: pip install pytest "Pillow>=10" "numpy>=1.24" "opencv-python-headless>=4.8"
      - run: pytest
